[build-system]
requires = ["setuptools>=72", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "leo-ai-backend"
version = "0.1.0"
description = "LEO - AI assistant backend for Bitmax Group customer support"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

dependencies = [
    # Web framework
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "httpx>=0.27.0,<1.0.0",

    # Data validation & settings
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.5.0,<3.0.0",

    # Database
    "sqlalchemy>=2.0.36,<3.0.0",
    "asyncpg>=0.30.0,<1.0.0",
    "alembic>=1.13.0,<2.0.0",
    "pgvector>=0.3.0,<1.0.0",
    "psycopg2-binary>=2.9.9,<3.0.0",

    # AI / LLM providers
    "openai>=1.51.0,<2.0.0",
    "anthropic>=0.34.0,<1.0.0",
    "tiktoken>=0.8.0,<1.0.0",

    # Knowledge / document parsing
    "beautifulsoup4>=4.12.0,<5.0.0",
    "lxml>=5.3.0,<6.0.0",
    "pypdf>=4.3.0,<6.0.0",
    "python-multipart>=0.0.12,<1.0.0",

    # Text processing
    "nltk>=3.9.0,<4.0.0",

    # Observability
    "structlog>=24.4.0,<27.0.0",
    "prometheus-client>=0.21.0,<1.0.0",
    "python-json-logger>=2.0.7,<3.0.0",

    # Security & utilities
    "python-jose[cryptography]>=3.3.0,<4.0.0",
    "passlib[bcrypt]>=1.7.4,<2.0.0",
    "slowapi>=0.1.9,<1.0.0",
    "tenacity>=8.5.0,<10.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<10.0.0",
    "pytest-asyncio>=0.24.0,<2.0.0",
    "pytest-cov>=5.0.0,<7.0.0",
    "pytest-mock>=3.14.0,<4.0.0",
    "httpx>=0.27.0,<1.0.0",
    "anyio>=4.6.0,<5.0.0",
    "factory-boy>=3.3.0,<4.0.0",
    "freezegun>=1.5.0,<2.0.0",
    "ruff>=0.7.0,<1.0.0",
    "mypy>=1.13.0,<2.0.0",
    "types-passlib>=1.7.7,<2.0.0",
    "types-python-jose>=3.3.4,<4.0.0",
    "sqlalchemy[mypy]>=2.0.36,<3.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "S", "PTH", "RUF",
]
ignore = [
    "S101", # Use of assert
    "S104", # Binding to 0.0.0.0
    "B008", # Function call in argument defaults (FastAPI Depends/Query pattern)
    "RUF012", # Mutable class attributes in Pydantic/SQLAlchemy
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "ANN", "RUF"]
"migrations/**/*.py" = ["ANN"]
"scripts/**/*.py" = ["T201", "ANN"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
exclude = ["migrations/", "scripts/"]

[[tool.mypy.overrides]]
module = [
    "pgvector.*",
    "nltk.*",
    "passlib.*",
    "slowapi.*",
    "jose.*",
    "bs4.*",
    "lxml.*",
    "prometheus_client.*",
    "pypdf.*",
    "structlog.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = ["--tb=short", "--strict-markers", "-q"]
markers = [
    "integration: requires PostgreSQL and live DB",
    "e2e: requires full stack including external AI provider",
    "slow: marks tests as slow",
    "security: security-focused tests",
]

[tool.coverage.run]
source = ["app"]
omit = ["migrations/*", "tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 70
